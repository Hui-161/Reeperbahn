name: lineup-check

# Taeglicher Abruf. Bei Aenderungen: Issue anlegen, Snapshot und Web-Daten
# committen. Der Commit loest das Cloudflare-Pages-Deployment aus.
on:
  schedule:
    # Das ganze Jahr einmal taeglich.
    - cron: "30 5 * * *"
    # Waehrend des Festivals alle 30 Minuten. Dann aendern sich Zeiten,
    # Absagen und Nachtraege stuendlich, und ein Stand von gestern frueh
    # taugt nicht mehr zum Planen. Der Lauf dauert 43 Sekunden, das Repo
    # ist oeffentlich, Actions-Minuten kosten also nichts.
    #
    # Krumme Minuten mit Absicht: zur vollen Stunde stehen bei GitHub die
    # meisten Zeitplaene an, und genau dann sind die Verzoegerungen am
    # groessten.
    #
    # Die Tage stehen fest verdrahtet (16.-20. September), weil das
    # Festival jedes Jahr an anderen Tagen liegt. Der 20. ist dabei, weil
    # der Samstagabend bis in den Sonntag hineinreicht.
    - cron: "7,37 * 16-20 9 *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lineup-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Eigene Tests
        run: |
          python3 rbf_core.py selftest
          python3 fetch_venues.py --selftest
          python3 gql.py --selftest

      - name: Line-up abrufen und vergleichen
        id: sync
        run: |
          set +e
          python3 sync.py --quiet > diff.txt 2> sync.err
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat sync.err >&2
          # Einzelne Felder, bei denen die Quelle ueber sich selbst stolpert.
          # Der Abruf laeuft dann weiter (siehe gql.unwrap), aber es soll
          # auffallen - sonst wird aus einem Ausrutscher unbemerkt Zustand.
          if grep -q "^Teilantwort:" sync.err; then
            echo "::warning::Die Quelle lieferte einzelne Felder nicht - siehe Log"
            {
              echo "## Unvollstaendige Felder aus der Quelle"
              echo
              echo '```'
              grep "^Teilantwort:" sync.err
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # 0 = keine Aenderung, 10 = Aenderungen, 1 = Abruf-Fehler
          if [ "$code" = "1" ]; then
            echo "::error::Abruf fehlgeschlagen - Details im Log oben"
            exit 1
          fi
          exit 0

      # Ein Spielort ohne Koordinaten fehlt auf der Karte - aergerlich, aber
      # kein Grund, das Programm NICHT zu aktualisieren. Genau das ist hier
      # aber passiert: seit dem ersten neuen Haus ohne Koordinaten brach
      # dieser Schritt den Lauf ab, und weil er VOR build_web, build_changes
      # und dem Commit steht, kamen tagelang keine Zeitaenderungen, Absagen
      # und Nachtraege mehr in der App an. Der Befund wird jetzt gemeldet,
      # nicht mehr zum Abbruch benutzt.
      - name: Spielorte pruefen
        run: |
          set +e
          python3 fetch_venues.py --check > venues.txt 2>&1
          code=$?
          cat venues.txt
          if [ "$code" != "0" ]; then
            echo "::warning::Spielorte ohne Koordinaten - sie fehlen auf der Karte"
            {
              echo "## Spielorte ohne Koordinaten"
              echo
              echo '```'
              cat venues.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Web-Daten neu bauen
        run: python3 build_web.py

      # Muss NACH build_web laufen und immer, nicht nur bei Aenderungen:
      # sonst faellt die Datei beim naechsten Lauf ohne Aenderung weg.
      - name: Aenderungsliste fuer die App bauen
        run: python3 build_changes.py

      - name: Aenderungen in die Job-Zusammenfassung
        if: steps.sync.outputs.code == '10'
        run: |
          {
            echo "## Line-up-Aenderungen"
            echo
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Nur beim taeglichen Lauf und von Hand. Bei 48 Laeufen am Tag waere
      # ein Issue je Aenderung Laerm statt Hinweis - und was sich geaendert
      # hat, steht ohnehin in der App unter "Aenderungen am Programm".
      - name: Issue anlegen
        if: steps.sync.outputs.code == '10' && github.event.schedule != '7,37 * 16-20 9 *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Line-up-Aenderungen $(date -u +%F)" \
            --body-file diff.txt

      - name: Snapshot und Web-Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots web/data
          if git diff --staged --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "Line-up-Aktualisierung $(date -u +%F)"
            # Bei halbstuendigen Laeufen ist main zwischendurch weitergezogen
            # - ein blosses push wird dann abgelehnt. Rebase ist hier sicher:
            # dieser Lauf aendert nur data/snapshots und web/data, und daran
            # arbeitet sonst niemand.
            git pull --rebase origin main
            git push
          fi
