name: lineup-check

# Taeglicher Abruf. Bei Aenderungen: Issue anlegen, Snapshot und Web-Daten
# committen. Der Commit loest das Cloudflare-Pages-Deployment aus.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: lineup-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Eigene Tests
        run: |
          python3 rbf_core.py selftest
          python3 fetch_venues.py --selftest

      - name: Line-up abrufen und vergleichen
        id: sync
        run: |
          set +e
          python3 sync.py --quiet > diff.txt 2> sync.err
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat sync.err >&2
          # 0 = keine Aenderung, 10 = Aenderungen, 1 = Abruf-Fehler
          if [ "$code" = "1" ]; then
            echo "::error::Abruf fehlgeschlagen - Details im Log oben"
            exit 1
          fi
          exit 0

      # Ein Spielort ohne Koordinaten fehlt auf der Karte - aergerlich, aber
      # kein Grund, das Programm NICHT zu aktualisieren. Genau das ist hier
      # aber passiert: seit dem ersten neuen Haus ohne Koordinaten brach
      # dieser Schritt den Lauf ab, und weil er VOR build_web, build_changes
      # und dem Commit steht, kamen tagelang keine Zeitaenderungen, Absagen
      # und Nachtraege mehr in der App an. Der Befund wird jetzt gemeldet,
      # nicht mehr zum Abbruch benutzt.
      - name: Spielorte pruefen
        run: |
          set +e
          python3 fetch_venues.py --check > venues.txt 2>&1
          code=$?
          cat venues.txt
          if [ "$code" != "0" ]; then
            echo "::warning::Spielorte ohne Koordinaten - sie fehlen auf der Karte"
            {
              echo "## Spielorte ohne Koordinaten"
              echo
              echo '```'
              cat venues.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Web-Daten neu bauen
        run: python3 build_web.py

      # Muss NACH build_web laufen und immer, nicht nur bei Aenderungen:
      # sonst faellt die Datei beim naechsten Lauf ohne Aenderung weg.
      - name: Aenderungsliste fuer die App bauen
        run: python3 build_changes.py

      - name: Aenderungen in die Job-Zusammenfassung
        if: steps.sync.outputs.code == '10'
        run: |
          {
            echo "## Line-up-Aenderungen"
            echo
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Issue anlegen
        if: steps.sync.outputs.code == '10'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Line-up-Aenderungen $(date -u +%F)" \
            --body-file diff.txt

      - name: Snapshot und Web-Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots web/data
          if git diff --staged --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "Line-up-Aktualisierung $(date -u +%F)"
            git push
          fi
